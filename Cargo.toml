[package]
name = "roomkit-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Reusable account authentication for RoomKit applications: Sign in with ChatGPT for local apps"
repository = "https://github.com/roomkit-live/roomkit-auth"
keywords = ["oauth", "chatgpt", "openai", "authentication", "pkce"]
categories = ["authentication"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
base64 = "0.23"
fs2 = "0.4"
getrandom = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
# rustls with the ring provider and the webpki roots, given to reqwest as a
# configuration: 0.13 has no ring-backed feature.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
axum = "0.8"
# gzip, as a host that also links roomkit-tools enables it: requests must still
# ask for uncompressed answers.
reqwest = { version = "0.13", default-features = false, features = ["gzip"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
